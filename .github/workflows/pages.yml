name: Publish float8

on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - sw.js
      - icon-192.png
      - icon-512.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
